<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurações Android</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px 15px;
        background: #f2f2f2;
    }

    button {
        width: 90%;
        max-width: 350px;
        padding: 20px;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        background: #4285f4;
        color: white;
        font-weight: bold;
    }
</style>
</head>

<body>

<h2>Motorola Moto E13</h2>
<p>Android 13</p>

<button onclick="abrirConfiguracoes()">
    ⚙️ Abrir Configurações
</button>

<script>

function abrirConfiguracoes() {

    window.location.href =
        "intent://settings#Intent;" +
        "action=android.settings.SETTINGS;" +
        "category=android.intent.category.DEFAULT;" +
        "end";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste de Configurações Android</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitulo {
            color: #666;
            margin-bottom: 25px;
        }

        button {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 7px rgba(0,0,0,0.15);
            font-size: 17px;
            text-align: left;
            cursor: pointer;
        }

        button:active {
            background: #ddd;
        }

        .principal {
            background: #1976d2;
            color: white;
            font-weight: bold;
        }

        .resultado {
            margin: 20px auto;
            max-width: 400px;
            padding: 12px;
            border-radius: 10px;
            background: #fff;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

<h1>⚙️ Teste Android</h1>

<div class="subtitulo">
    Moto E13 • Android 13
</div>

<div class="resultado" id="resultado">
    Escolha uma opção para testar.
</div>


<button class="principal" onclick="abrir('android.settings.SETTINGS')">
    ⚙️ Configurações principal
</button>


<button onclick="abrir('android.settings.WIFI_SETTINGS')">
    📶 Wi-Fi
</button>


<button onclick="abrir('android.settings.BLUETOOTH_SETTINGS')">
    🔵 Bluetooth
</button>


<button onclick="abrir('android.settings.WIRELESS_SETTINGS')">
    📡 Rede / conexões
</button>


<button onclick="abrir('android.settings.DATA_USAGE_SETTINGS')">
    📊 Uso de dados
</button>


<button onclick="abrir('android.settings.DISPLAY_SETTINGS')">
    🖥️ Tela
</button>


<button onclick="abrir('android.settings.WALLPAPER_SETTINGS')">
    🖼️ Papel de parede
</button>


<button onclick="abrir('android.settings.SOUND_SETTINGS')">
    🔊 Som
</button>


<button onclick="abrir('android.settings.BATTERY_SETTINGS')">
    🔋 Bateria
</button>


<button onclick="abrir('android.settings.STORAGE_SETTINGS')">
    💾 Armazenamento
</button>


<button onclick="abrir('android.settings.APPLICATION_SETTINGS')">
    📦 Aplicativos
</button>


<button onclick="abrir('android.settings.MANAGE_APPLICATIONS_SETTINGS')">
    📦 Gerenciar aplicativos
</button>


<button onclick="abrir('android.settings.SECURITY_SETTINGS')">
    🔐 Segurança
</button>


<button onclick="abrir('android.settings.LOCATION_SOURCE_SETTINGS')">
    📍 Localização
</button>


<button onclick="abrir('android.settings.DATE_SETTINGS')">
    🕐 Data e hora
</button>


<button onclick="abrir('android.settings.LANGUAGE_SETTINGS')">
    🌐 Idioma
</button>


<button onclick="abrir('android.settings.ACCESSIBILITY_SETTINGS')">
    ♿ Acessibilidade
</button>


<button onclick="abrir('android.settings.DEVICE_INFO_SETTINGS')">
    ℹ️ Sobre o telefone
</button>


<script>

function abrir(acao) {

    document.getElementById("resultado").innerHTML =
        "Tentando abrir: " + acao;

    /*
     * Intent Android iniciado pelo toque do usuário.
     */
    window.location.href =
        "intent:#Intent;" +
        "action=" + acao + ";" +
        "end";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atalhos Android 13</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
        }

        p {
            color: #555;
        }

        .botao {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 12px auto;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            font-size: 17px;
            text-decoration: none;
            color: #222;
            box-sizing: border-box;
        }

        .botao:active {
            background: #ddd;
        }
    </style>
</head>

<body>

    <h1>⚙️ Atalhos Android 13</h1>

    <p>Motorola Moto E13</p>

    <a class="botao"
       href="intent:#Intent;action=android.settings.SETTINGS;end">
       ⚙️ Configurações
    </a>

    <a class="botao"
       href="intent:#Intent;action=android.settings.WIFI_SETTINGS;end">
       📶 Wi-Fi
    </a>

    <a class="botao"
       href="intent:#Intent;action=android.settings.BLUETOOTH_SETTINGS;end">
       🟦 Bluetooth
    </a>

    <a class="botao"
       href="intent:#Intent;action=android.settings.DISPLAY_SETTINGS;end">
       📱 Tela
    </a>

    <a class="botao"
       href="intent:#Intent;action=android.settings.BATTERY_SETTINGS;end">
       🔋 Bateria
    </a>

    <a class="botao"
       href="intent:#Intent;action=android.settings.INTERNAL_STORAGE_SETTINGS;end">
       💾 Armazenamento
    </a>

    <a class="botao"
       href="intent:#Intent;action=android.settings.APPLICATION_SETTINGS;end">
       📦 Aplicativos
    </a>

    <a class="botao"
       href="intent:#Intent;action=android.settings.SECURITY_SETTINGS;end">
       🔐 Segurança
    </a>

    <a class="botao"
       href="intent:#Intent;action=android.settings.DEVICE_INFO_SETTINGS;end">
       ℹ️ Sobre o telefone
    </a>

    <a class="botao"
       href="intent:#Intent;action=android.settings.DATE_SETTINGS;end">
       🕐 Data e hora
    </a>

</body>
</html>

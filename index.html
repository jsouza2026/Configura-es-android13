<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste Android - Moto E13</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
        }

        .info {
            color: #555;
            margin-bottom: 25px;
        }

        button {
            display: block;
            width: 100%;
            max-width: 380px;
            margin: 12px auto;
            padding: 17px;
            border: 0;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 7px rgba(0,0,0,.18);
            font-size: 17px;
            cursor: pointer;
        }

        button:active {
            background: #ddd;
        }

        .principal {
            background: #4285f4;
            color: white;
            font-weight: bold;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>

<body>

    <h1>⚙️ Teste Android</h1>

    <div class="info">
        Motorola Moto E13<br>
        Android 13
    </div>


    <!-- MÉTODO 1 -->

    <button class="principal" onclick="abrirConfiguracoes()">
        ⚙️ Abrir Configurações
    </button>


    <!-- MÉTODO 2 -->

    <button onclick="abrirIntent()">
        🔧 Testar Intent Android
    </button>


    <!-- MÉTODO 3 -->

    <button onclick="abrirAndroidApp()">
        📱 Testar Android-App
    </button>


    <!-- OUTRAS CONFIGURAÇÕES -->

    <button onclick="abrir('android.settings.WIFI_SETTINGS')">
        📶 Wi-Fi
    </button>

    <button onclick="abrir('android.settings.BLUETOOTH_SETTINGS')">
        🟦 Bluetooth
    </button>

    <button onclick="abrir('android.settings.DISPLAY_SETTINGS')">
        📱 Tela
    </button>

    <button onclick="abrir('android.settings.BATTERY_SETTINGS')">
        🔋 Bateria
    </button>

    <button onclick="abrir('android.settings.APPLICATION_SETTINGS')">
        📦 Aplicativos
    </button>

    <button onclick="abrir('android.settings.SECURITY_SETTINGS')">
        🔐 Segurança
    </button>

    <button onclick="abrir('android.settings.DEVICE_INFO_SETTINGS')">
        ℹ️ Sobre o telefone
    </button>


    <div id="resultado">
        Escolha uma opção acima.
    </div>


<script>

function mensagem(texto) {
    document.getElementById("resultado").innerHTML = texto;
}


/*
 MÉTODO 1
 Tenta abrir diretamente o aplicativo
 Configurações.
*/

function abrirConfiguracoes() {

    mensagem("Tentando abrir Configurações...");

    window.location.href =
        "intent://settings#Intent;" +
        "scheme=android-app;" +
        "package=com.android.settings;" +
        "end";
}


/*
 MÉTODO 2
 Intent usando a ação SETTINGS.
*/

function abrirIntent() {

    mensagem("Tentando Intent Android...");

    window.location.href =
        "intent:#Intent;" +
        "action=android.settings.SETTINGS;" +
        "end";
}


/*
 MÉTODO 3
 Android App URI.
*/

function abrirAndroidApp() {

    mensagem("Tentando android-app://...");

    window.location.href =
        "android-app://com.android.settings/";
}


/*
 ABRIR OUTRAS TELAS
*/

function abrir(acao) {

    mensagem("Abrindo " + acao + "...");

    window.location.href =
        "intent:#Intent;" +
        "action=" + acao + ";" +
        "end";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Configurações Android</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 15px;
            background: #f2f2f2;
        }

        h2 {
            margin-bottom: 10px;
        }

        button {
            width: 90%;
            max-width: 350px;
            padding: 20px;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            background: #1976d2;
            color: white;
            font-size: 19px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>Teste Android</h2>

<p>Toque no botão abaixo:</p>

<a href="intent://com.android.settings.slices/?slice=content%3A%2F%2Fcom.android.settings.slices%2Fintent%2Fteste#Intent;scheme=settings;package=com.android.settings;end">
    <button>
        ⚙️ ABRIR CONFIGURAÇÕES
    </button>
</a>

</body>
</html>
